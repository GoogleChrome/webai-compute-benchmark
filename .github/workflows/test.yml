name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    build:
        name: Build
        runs-on: macos-latest
        permissions:
            contents: read
        strategy:
            matrix:
                # TODO enable safari and firefox
                browser: [chrome]
        steps:
            - name: Install Firefox
              if: ${{ matrix.browser == 'firefox' }}
              run: brew install --cask firefox

            - name: Checkout Branch
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  lfs: true

            - name: Setup Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: "package.json"
                  cache: "npm"

            - name: Install Node Packages
              run: npm ci

            - name: Cache Models
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: |
                      resources/transformers-js/models
                      resources/litert-js/models
                      resources/experimental/models
                  key: ${{ runner.os }}-models-${{ hashFiles('**/download-models.mjs', '.gitattributes') }}
                  restore-keys: |
                      ${{ runner.os }}-models-

            - name: Download Models and Build Benchmarks
              run: npm run build

            - name: Run Unit Tests
              run: |
                  echo "Running in $BROWSER"
                  npm run test:${{ matrix.browser }}

            - name: Run end2end Tests
              run: |
                  echo "Running in $BROWSER"
                  npm run test-e2e:${{ matrix.browser }}
